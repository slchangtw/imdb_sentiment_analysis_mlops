[project]
name = "imdb_sentiment"
version = "0.1.0"
description = ""
authors = [{ name = "Shun-Lung Chang", email = "shunlung.chang@gmail.com" }]
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "mlflow>=2.3.1,<3",
    "optuna>=3.2.0,<4",
    "gitpython>=3.1.32,<4",
    "typer>=0.9.0,<0.10",
    "metaflow>=2.15.4",
    "psycopg2>=2.9.10",
]

[dependency-groups]
dev = ["ipykernel>=6.24.0,<7"]
test = [
    "pytest>=7.4.0,<8",
    "black>=23.7.0,<24",
    "pre-commit>=3.3.3,<4",
    "ruff>=0.0.280,<0.0.281",
]
app = [
    "fastapi>=0.104.0,<0.105",
    "uvicorn>=0.23.2,<0.24",
]

[tool.uv]
default-groups = [
    "dev",
    "test",
    "app",
]
